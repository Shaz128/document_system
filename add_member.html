<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Member</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
    
    .input-hover:hover {
      transform: scale(1.01);
    }
    
    .input-active:active {
      transform: scale(0.99);
    }
    
    .button-hover:hover {
      transform: scale(1.05);
    }
    
    .button-active:active {
      transform: scale(0.95);
    }
    
    .transition-all {
      transition: all 0.2s ease;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100 p-4 md:p-8">
  <div class="animate-fade-in max-w-2xl mx-auto">
    <div class="bg-gray-800 border border-gray-700 rounded-lg shadow-lg overflow-hidden">
      <div class="p-6 border-b border-gray-700">
        <h2 class="text-2xl font-bold">Add New Member</h2>
      </div>
      
      <form id="memberForm" class="p-6">
        <div class="space-y-4">
          <div class="input-hover input-active transition-all">
            <div class="space-y-2">
              <label for="name" class="block text-sm font-medium">Full Name</label>
              <input
                id="name"
                name="name"
                type="text"
                class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                required
              />
            </div>
          </div>

          <div class="input-hover input-active transition-all">
            <div class="space-y-2">
              <label for="phone" class="block text-sm font-medium">Phone Number</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                required
              />
            </div>
          </div>

          <div class="input-hover input-active transition-all">
            <div class="space-y-2">
              <label for="address" class="block text-sm font-medium">Address</label>
              <input
                id="address"
                name="address"
                type="text"
                class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                required
              />
            </div>
          </div>

          <div class="input-hover input-active transition-all">
            <div class="space-y-2">
              <label for="rentedAmount" class="block text-sm font-medium">Rented Amount</label>
              <input
                id="rentedAmount"
                name="rentedAmount"
                type="number"
                class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                required
              />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="input-hover input-active transition-all">
              <div class="space-y-2">
                <label for="rentedFrom" class="block text-sm font-medium">Rented From</label>
                <input
                  id="rentedFrom"
                  name="rentedFrom"
                  type="date"
                  class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                  required
                />
              </div>
            </div>

            <div class="input-hover input-active transition-all">
              <div class="space-y-2">
                <label for="rentedTill" class="block text-sm font-medium">Rented Till</label>
                <input
                  id="rentedTill"
                  name="rentedTill"
                  type="date"
                  class="w-full bg-gray-700 border border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                  required
                />
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-end mt-6">
          <button
            type="submit"
            class="button-hover button-active transition-all bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md"
          >
            Add Member
          </button>
        </div>
      </form>
    </div>
  </div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js';

  const supabase = createClient('https://jpihbpeqhbdmterdwtmt.supabase.co ', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwaWhicGVxaGJkbXRlcmR3dG10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDUzNTcwMjksImV4cCI6MjA2MDkzMzAyOX0.hMr_JbDyKDQiUW6t1VefVv-gNZHpSk0GMgASfpJzuig
'); // Replace these

  document.getElementById('memberForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const formData = {
      name: document.getElementById('name').value,
      phone_number: Number(document.getElementById('phone').value),
      address: document.getElementById('address').value,
      rented_amount: Number(document.getElementById('rentedAmount').value),
      rented_from: document.getElementById('rentedFrom').value,
      rented_till: document.getElementById('rentedTill').value
    };

    const { data, error } = await supabase.from('members').insert([formData]);

    if (error) {
      alert('❌ Error adding member: ' + error.message);
      console.error(error);
    } else {
      alert('✅ Member added successfully!');
      e.target.reset(); // Clear the form
    }
  });
</script>

</body>
</html>
